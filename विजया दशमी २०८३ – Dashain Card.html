.scene{position:absolute;inset:0}
.hid{visibility:hidden;pointer-events:none}
img{display:block;max-width:none}
.abs{position:absolute}
/* kites */
.kw{position:absolute;cursor:pointer;outline:none}
.kw:focus-visible{outline:3px dashed #c4161c;outline-offset:2px;border-radius:8px}
.ki{width:100%;height:auto;pointer-events:none;transform-origin:var(--org,50% 10%)}
.ki.a,.ki.b{animation:sway var(--sw,4s) ease-in-out var(--sd,0s) infinite alternate;animation-play-state:paused}
.live .ki{animation-play-state:running}
@keyframes sway{from{transform:rotate(calc(var(--amp,2deg) * -1)) translateY(0)}to{transform:rotate(var(--amp,2deg)) translateY(-1.2%)}}
/* page A */
#A .kw{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}
#A.fly .kw{animation:flyin 2.3s cubic-bezier(.16,.8,.22,1) var(--d) forwards}
@keyframes flyin{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}12%{opacity:1}100%{opacity:1;transform:none}}
#A.out .kw{animation:flyout .9s cubic-bezier(.5,0,.9,.4) var(--d) forwards}
@keyframes flyout{from{opacity:1;transform:none}to{opacity:0;transform:translate(0,-160%) scale(.8)}}
#A .title{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}
#A.fly .title{animation:titlein 1.6s ease 2.1s forwards}
@keyframes titlein{to{opacity:1;transform:none;filter:blur(0)}}
#A.out .title{animation:titleout .6s ease forwards}
@keyframes titleout{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
/* page B */
#B .tray,#B .env,#B .kb{opacity:0}
#B.in .tray{animation:fadein 1.1s ease forwards}
#B.in .env{animation:rise 1s cubic-bezier(.2,.8,.2,1) .15s forwards}
#B.in .kb{animation:drop 1.1s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes fadein{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10%)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-25%)}to{opacity:1;transform:none}}
#B.back .tray{animation:fadeout .7s ease forwards}
#B.back .env{animation:sink .7s ease forwards}
#B.back .kb{animation:flyout .8s cubic-bezier(.5,0,.9,.4) var(--d) forwards}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes sink{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10%)}}
.env{cursor:pointer;outline:none}
.env:focus-visible{outline:3px dashed #c4161c;outline-offset:3px}
.env img{width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 .8vmin 1.2vmin rgba(60,20,0,.28))}
/* lifted letter */
#lift{position:fixed;inset:0;z-index:20;visibility:hidden;cursor:pointer}
#lift.on{visibility:visible}
#shade{position:absolute;inset:0;background:rgba(60,28,8,.42);opacity:0;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#group{position:absolute;left:50%;top:50%;--lw:min(92vw,calc(88vh / 1.3 * 1176 / 720));width:var(--lw);aspect-ratio:1176/720;margin-left:calc(var(--lw) / -2);margin-top:calc(var(--lw) * 720 / 1176 * -.65);will-change:transform,opacity;opacity:0}
#group>img.letter{width:100%;height:auto;box-shadow:0 1.6vmin 4vmin rgba(40,15,0,.5)}
#group .g{position:absolute;opacity:0}
#group .g img{width:100%;height:auto;filter:drop-shadow(0 .6vmin .9vmin rgba(40,15,0,.3))}
/* hint */
#hint{position:fixed;left:50%;bottom:calc(2.4vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:30;max-width:92vw;padding:.55em 1.1em;border-radius:999px;background:var(--pill);color:var(--ink);font-size:clamp(12px,1.9vmin,17px);font-weight:600;letter-spacing:.01em;box-shadow:0 2px 12px rgba(90,40,10,.2);opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;text-align:center;white-space:nowrap}
#hint.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ki.a,.ki.b{animation:none!important}}
</style>
</head>

<div id="hint" aria-live="polite"></div>
<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var A=$('#A'),B=$('#B'),env=$('#env'),lift=$('#lift'),group=$('#group'),shade=$('#shade'),hint=$('#hint'),gM=$('#gM'),gT=$('#gT');
var state='boot',reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var timers=[];function later(f,ms){var t=setTimeout(f,ms);timers.push(t);return t}
var HINTS={A:'Tap a kite 🪁  ·  चङ्गा छुनुहोस्',B:'Tap the letter to read  ·  Tap a kite to go back',open:''};
function setHint(k){hint.classList.remove('show');if(!HINTS[k])return;later(function(){hint.textContent=HINTS[k];hint.classList.add('show')},k==='A'?4200:1800)}
function wait(el){return Promise.all($$('img',el).map(function(i){return i.decode?i.decode().catch(function(){}):Promise.resolve()}))}
function showA(){
  state='busy';B.classList.add('hid');A.classList.remove('hid','out','fly','live');
  void A.offsetWidth;A.classList.add('fly');
  later(function(){A.classList.add('live')},1200);
  later(function(){state='A'},reduce?200:2600);setHint('A');
}
function toB(){
  if(state!=='A')return;state='busy';hint.classList.remove('show');
  A.classList.add('out');
  later(function(){A.classList.add('hid');A.classList.remove('live');
    B.classList.remove('hid','back','in','live');void B.offsetWidth;B.classList.add('in');
    later(function(){B.classList.add('live')},600);
    later(function(){state='B'},1300);setHint('B');
  },950);
}
function toA(){
  if(state!=='B')return;state='busy';hint.classList.remove('show');
  B.classList.remove('in');B.classList.add('back');
  later(function(){B.classList.add('hid');B.classList.remove('back','live');showA()},900);
}
var KF=null,anim=null;
function geom(){
  var E=env.getBoundingClientRect(),G=group.getBoundingClientRect();
  var s=(E.width*0.8)/G.width,dx=(E.left+E.width/2)-(G.left+G.width/2),dy=(E.top+E.height*0.2)-(G.top+G.height/2);
  return [{opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale('+s+')',offset:0},{opacity:1,offset:.3},{opacity:1,transform:'translate(0,0) scale(1)',offset:1}];
}
function pop(g,delay){
  g.style.opacity=0;
  return g.animate([{opacity:0,transform:'translateY(28%) scale(.75)'},{opacity:1,transform:'translateY(-3%) scale(1.04)',offset:.7},{opacity:1,transform:'none'}],{duration:reduce?1:650,delay:reduce?0:delay,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
}
function openLetter(){
  if(state!=='B')return;state='busy';hint.classList.remove('show');
  lift.classList.add('on');lift.setAttribute('aria-hidden','false');
  group.style.opacity=1;KF=geom();
  var d=reduce?1:750;
  shade.animate([{opacity:0},{opacity:1}],{duration:d,fill:'both'});
  anim=group.animate(KF,{duration:d,easing:'cubic-bezier(.22,.9,.25,1)',fill:'both'});
  // one tap: letter and gifts arrive together
  [gM,gT].forEach(function(g){g.getAnimations().forEach(function(a){a.cancel()})});
  pop(gM,reduce?0:280);pop(gT,reduce?0:420);
  later(function(){state='open';group.focus&&group.focus();},reduce?50:1050);
}
function closeLetter(){
  if(state!=='open')return;state='busy';
  var d=reduce?1:200;
  [gM,gT].forEach(function(g){g.getAnimations().forEach(function(a){a.cancel()});g.animate([{opacity:1},{opacity:0}],{duration:d,fill:'both'})});
  later(function(){
    KF=geom();
    var back=group.animate(KF,{duration:reduce?1:620,easing:'cubic-bezier(.5,0,.75,.2)',direction:'reverse',fill:'both'});
    shade.animate([{opacity:1},{opacity:0}],{duration:reduce?1:620,fill:'both'});
    back.onfinish=function(){
      group.getAnimations().forEach(function(a){a.cancel()});shade.getAnimations().forEach(function(a){a.cancel()});
      group.style.opacity=0;[gM,gT].forEach(function(g){g.getAnimations().forEach(function(a){a.cancel()});g.style.opacity=0});
      lift.classList.remove('on');lift.setAttribute('aria-hidden','true');state='B';setHint('B');env.focus&&env.focus({preventScroll:true});
    };
  },reduce?1:230);
}
function act(el,fn){
  el.addEventListener('click',function(e){e.stopPropagation();fn()});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
}
$$('#A .kw').forEach(function(k){act(k,toB)});
$$('#B .kb').forEach(function(k){act(k,toA)});
